<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة متجر رحّال</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14231d;background:#f6faf8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:1.5rem;font-weight:800;color:#2a6150}.card{background:#fff;border:1px solid #dce6e0;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 28px #183d2a0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:.9rem;color:#566860}.in{width:100%;padding:11px 12px;border:1px solid #cbd9d1;border-radius:10px;background:#fbfdfc;font:inherit}.in:focus{outline:3px solid #a8832f55;border-color:#2a6150}textarea.in{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2a6150;color:#fff;cursor:pointer;font:inherit}.btn.alt{background:#fff;color:#2a6150;border:1px solid #2a6150}.btn.danger{background:#b3261e}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.muted{color:#667a70}.msg{padding:10px 12px;border-radius:10px;background:#eef7f1;margin-top:10px}.error{background:#fff0ef;color:#a51f1a}.hidden{display:none!important}.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.media-item{position:relative;border:1px solid #dce6e0;border-radius:12px;overflow:hidden;background:#f1e7d9}.media-item img,.media-item video{display:block;width:100%;height:150px;object-fit:cover}.media-item .cap{padding:8px;font-size:.8rem;display:flex;justify-content:space-between;gap:6px;align-items:center}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.kpi{border:1px solid #dce6e0;border-radius:12px;padding:14px}.kpi b{display:block;font-size:1.6rem;color:#2a6150}.login{max-width:420px;margin:12vh auto}.small{font-size:.85rem}
</style>
</head><body>
<div class="wrap">
<header class="top"><div class="brand">رحّال · إدارة المتجر</div><button id="signOut" class="btn alt hidden">تسجيل الخروج</button></header>
<section id="loginCard" class="card login"><h1>دخول الأدمن</h1><p class="muted">اكتب بريد الأدمن، وسنرسل لك رابط دخول آمن. لا توجد كلمة مرور داخل الموقع.</p><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" class="in" type="email" value="ahmedcycoo2@gmail.com" autocomplete="email"></div><div class="actions" style="margin-top:12px"><button id="sendLink" class="btn">إرسال رابط الدخول</button></div><div id="loginMsg" class="msg hidden"></div></section>
<main id="app" class="hidden">
<section class="card"><h1>لوحة التحكم</h1><p class="muted">أي حفظ هنا يظهر للزوار على الموقع المنشور مباشرة.</p><div id="appMsg" class="msg hidden"></div></section>
<section class="card"><h2>بيانات المنتج</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="productName" class="in"></div><div class="field"><label>السعر بالجنيه</label><input id="price" class="in" type="number" min="0"></div><div class="field"><label>السعر القديم</label><input id="oldPrice" class="in" type="number" min="0"></div><div class="field"><label>رقم واتساب بصيغة دولية</label><input id="whatsapp" class="in" dir="ltr" inputmode="tel"></div></div><div class="field" style="margin-top:14px"><label>وصف المنتج</label><textarea id="description" class="in"></textarea></div><div class="actions" style="margin-top:14px"><button id="saveSettings" class="btn">حفظ بيانات المنتج</button></div></section>
<section class="card"><h2>رفع الصور والفيديو</h2><div class="grid"><div class="field"><label>الصورة الرئيسية</label><input id="heroFile" class="in" type="file" accept="image/*"><button id="uploadHero" class="btn" type="button">رفع وتعيين الرئيسية</button></div><div class="field"><label>صور المعرض</label><input id="galleryFiles" class="in" type="file" accept="image/*" multiple><button id="uploadGallery" class="btn" type="button">رفع صور المعرض</button></div><div class="field"><label>فيديو المنتج</label><input id="videoFile" class="in" type="file" accept="video/*"><button id="uploadVideo" class="btn" type="button">رفع وتعيين الفيديو</button></div></div><div id="mediaMsg" class="msg hidden"></div><h3 style="margin-top:20px">الملفات الحالية</h3><div id="mediaList" class="media"></div></section>
<section class="card"><h2>المتابعة</h2><div id="kpis" class="kpis"></div><div id="eventStats" class="card" style="margin-top:14px;background:#fbfdfc"></div><h3>آخر الطلبات</h3><div id="orders" class="small muted">جاري التحميل…</div></section>
</main></div>
<script>
const SUPABASE_URL='https://hhksrebheklaoxxzhgxr.supabase.co';
const SUPABASE_KEY='sb_publishable_s5JlCsd6xCH9S1kKTqh52w_ZQCVp_Cr';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let settings={};
const $=id=>document.getElementById(id);const show=(el,on=true)=>el.classList.toggle('hidden',!on);const notice=(el,text,error=false)=>{el.textContent=text;el.classList.toggle('hidden',false);el.classList.toggle('error',error)};
$('sendLink').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email)return notice($('loginMsg'),'اكتب البريد أولًا',true);$('sendLink').disabled=true;notice($('loginMsg'),'جاري إرسال رابط الدخول…');const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('sendLink').disabled=false;if(error){const msg=error.status===429||String(error.message||'').toLowerCase().includes('rate')?'خدمة البريد المجانية وصلت للحد المؤقت. انتظر دقيقة ثم اضغط مرة واحدة فقط.':error.message;notice($('loginMsg'),msg,true)}else notice($('loginMsg'),'تم إرسال رابط الدخول إلى بريدك. افتحه ثم ارجع للوحة التحكم.')};
async function isAdmin(){const {data,error}=await db.from('admin_users').select('email,is_active').maybeSingle();return !error&&data&&data.is_active}
async function start(){const {data:{session}}=await db.auth.getSession();if(!session||!(await isAdmin())){show($('loginCard'));show($('app'),false);show($('signOut'),false);return}show($('loginCard'),false);show($('app'));show($('signOut'));await loadAll()}
$('signOut').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange(()=>setTimeout(start,0));
async function loadAll(){const {data,error}=await db.from('site_settings').select('*').eq('id',1).single();if(error)return notice($('appMsg'),'تعذر تحميل الإعدادات: '+error.message,true);settings=data||{};$('productName').value=settings.product_name||'';$('description').value=settings.description||'';$('price').value=settings.price||0;$('oldPrice').value=settings.old_price||'';$('whatsapp').value=settings.whatsapp||'';await loadMedia();await loadStats()}
$('saveSettings').onclick=async()=>{const patch={product_name:$('productName').value.trim(),description:$('description').value.trim(),price:Number($('price').value)||0,old_price:$('oldPrice').value?Number($('oldPrice').value):null,whatsapp:$('whatsapp').value.replace(/\D/g,'')};const {error}=await db.from('site_settings').update({...patch,updated_at:new Date().toISOString()}).eq('id',1);notice($('appMsg'),error?'فشل الحفظ: '+error.message:'تم حفظ بيانات المنتج، وستظهر للزوار الآن.',!!error)};
async function upload(file,kind){if(!file)return null;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'-');const path='admin/'+Date.now()+'-'+safe;const {error}=await db.storage.from('rahhal-media').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;const {data}=db.storage.from('rahhal-media').getPublicUrl(path);const {data:row,error:e}=await db.from('media_assets').insert({kind,url:data.publicUrl,storage_path:path,alt_text:'منتج رحّال'}).select().single();if(e)throw e;return row}
async function runUpload(file,kind,after){try{notice($('mediaMsg'),'جاري الرفع…');const row=await upload(file,kind);if(after)await after(row);notice($('mediaMsg'),'تم الرفع والحفظ بنجاح.');await loadAll()}catch(e){notice($('mediaMsg'),'فشل الرفع: '+e.message,true)}}
$('uploadHero').onclick=()=>runUpload($('heroFile').files[0],'image',async row=>{await db.from('site_settings').update({hero_image_url:row.url,updated_at:new Date().toISOString()}).eq('id',1)});
$('uploadVideo').onclick=()=>runUpload($('videoFile').files[0],'video',async row=>{await db.from('site_settings').update({video_url:row.url,updated_at:new Date().toISOString()}).eq('id',1)});
$('uploadGallery').onclick=async()=>{const files=[...$('galleryFiles').files].slice(0,8);for(const f of files)await runUpload(f,'image');};
async function loadMedia(){const {data}=await db.from('media_assets').select('*').order('sort_order').order('created_at',{ascending:false});$('mediaList').replaceChildren(...(data||[]).map(m=>{const box=document.createElement('div');box.className='media-item';box.innerHTML=(m.kind==='video'?'<video controls src="'+m.url+'"></video>':'<img src="'+m.url+'" alt="'+(m.alt_text||'')+'">')+'<div class="cap"><span>'+m.kind+'</span><button class="btn danger small">حذف</button></div>';box.querySelector('button').onclick=async()=>{if(!confirm('حذف هذا الملف؟'))return;await db.from('media_assets').delete().eq('id',m.id);if(m.storage_path)await db.storage.from('rahhal-media').remove([m.storage_path]);await loadMedia()};return box}))}
async function loadStats(){const since=new Date(Date.now()-30*864e5).toISOString();const [{data:events},{data:orders}]=await Promise.all([db.from('analytics_events').select('event_name,session_id,page_path,created_at,metadata').gte('created_at',since).order('created_at',{ascending:false}).limit(2000),db.from('orders').select('customer_name,phone,total,status,created_at').order('created_at',{ascending:false}).limit(10)]);const ev=events||[],count=n=>ev.filter(x=>x.event_name===n).length,unique=new Set(ev.map(x=>x.session_id).filter(Boolean)).size;$('kpis').innerHTML='<div class="kpi">الزيارات<b>'+count('page_view')+'</b></div><div class="kpi">عملاء فريدون<b>'+unique+'</b></div><div class="kpi">ضغطات واتساب<b>'+count('whatsapp_click')+'</b></div><div class="kpi">إضافات للسلة<b>'+count('add_to_cart')+'</b></div><div class="kpi">طلبات مكتملة<b>'+count('order_placed')+'</b></div>';const groups={};ev.forEach(x=>groups[x.event_name]=(groups[x.event_name]||0)+1);const labels={page_view:'فتح المتجر',section_view:'مشاهدة قسم',view_item:'مشاهدة المنتج',add_to_cart:'إضافة للسلة',begin_checkout:'بدء الطلب',order_placed:'إتمام الطلب',whatsapp_click:'ضغط واتساب',click:'ضغط زر'};const rows=Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="bar-row"><span>'+ (labels[k]||k) +'</span><span class="track-b"><i class="fill" style="display:block;width:'+Math.max(3,Math.round(v/Math.max(...Object.values(groups))*100))+'%"></i></span><b>'+v+'</b></div>').join('');const recent=ev.slice(0,12).map(x=>'<div style="padding:6px 0;border-bottom:1px dashed #dce6e0">'+(labels[x.event_name]||x.event_name)+' · '+(x.page_path||'/')+' · '+new Date(x.created_at).toLocaleString('ar-EG')+'</div>').join('');$('eventStats').innerHTML='<h3>تفاعل العملاء خلال آخر 30 يوم</h3><div class="bars">'+(rows||'لا توجد بيانات بعد')+'</div><h3 style="margin-top:18px">آخر الأحداث</h3><div class="small muted">'+(recent||'لا توجد حركة بعد')+'</div>';$('orders').innerHTML=(orders||[]).map(o=>'<div style="padding:8px 0;border-bottom:1px solid #dce6e0">'+o.customer_name+' · '+o.phone+' · '+o.total+' جنيه · '+o.status+'</div>').join('')||'لا توجد طلبات بعد.'}
start();
</script></body></html>
